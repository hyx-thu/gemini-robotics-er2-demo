[project]
name = "physical-agent"
version = "0.1.0"
description = "Physical Agent Server managed with uv"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "google-genai>=1.0.0",
    "google-generativeai>=0.8.0",
    "websockets>=12.0",
    "websocket-client>=1.8.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[project.scripts]
physical-agent = "server:main"
run-agent = "server:main"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "session_config", "session_manager", "camera_poller"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["*.md", "ui/*", "ui/**/*", "prompt/data/*"]
